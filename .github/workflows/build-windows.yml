name: build-windows-x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Build Windows setup + portable
        run: |
          npm run build:python
          npm run build
          npx electron-builder --win --publish never

      - name: Sign Windows (self-signed, best effort)
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-win.ps1

      - name: Create green zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $release = Join-Path $PWD "release/$version"
          $green = Join-Path $release "StockLens-$version-win-x64"
          if (Test-Path $green) { Remove-Item $green -Recurse -Force }
          Copy-Item (Join-Path $release 'win-unpacked') $green -Recurse
          if (Test-Path "$release/stocklens-selfsigned.cer") {
            Copy-Item "$release/stocklens-selfsigned.cer" (Join-Path $green 'stocklens-selfsigned.cer')
          }
          $zip = Join-Path $release "StockLens-$version-win-x64.zip"
          Compress-Archive -Path $green -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          Get-Item $zip | Select-Object Name, Length

      - name: Checksums and certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $release = Join-Path $PWD "release/$version"
          Get-ChildItem $release -Filter '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
            Write-Host "$($_.Name) $hash"
          }
          if (Test-Path "$release/stocklens-selfsigned.cer") {
            Copy-Item "$release/stocklens-selfsigned.cer" "$release/stocklens-selfsigned.cer.txt"
          }

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "tag/package version mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: stocklens-windows-x64-${{ github.run_id }}
          path: |
            release/*/stocklens-*-setup.exe
            release/*/stocklens-*-portable.exe
            release/*/StockLens-*-win-x64.zip
            release/*/*.sha256
            release/*/stocklens-selfsigned.cer
          if-no-files-found: error
          retention-days: 14
